<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management Tool</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main class="shell">
      <header class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Project Management Tool</h1>
          <p class="muted">Sign in as Employee or Scrum Master</p>
        </div>
      </header>

      <section class="card">
        <div class="tabs" role="tablist" aria-label="Role selection">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-role="employee">
            Employee
          </button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-role="scrum">
            Scrum Master
          </button>
        </div>

        <form id="loginForm" class="form" autocomplete="on">
          <input type="hidden" id="role" name="role" value="employee" />

          <div class="grid2">
            <label class="field">
              <span>Email</span>
              <input id="email" name="email" type="email" placeholder="name@company.com" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input id="password" name="password" type="password" placeholder="••••••••" required />
            </label>
          </div>

          <div class="row">
            <button class="btn primary" type="submit">Sign in</button>
            <button class="btn ghost" type="button" id="fillDemo">Use demo</button>
          </div>

          <p id="error" class="error" role="alert" aria-live="polite"></p>

          <div class="hint">
            <div class="pill">Employee → Daily updates form</div>
            <div class="pill">Scrum Master → Notes + Reports</div>
          </div>
        </form>
      </section>

      <footer class="footer muted">
        <span>Local-only storage (browser).</span>
      </footer>
    </main>

    <script type="module" src="src/login.js"></script>
  </body>
</html>
